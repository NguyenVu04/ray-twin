[workspace]
members = ["crates/*"]
# raytwin-py is built by maturin and tested with pytest, so plain `cargo` needs no Python
default-members = ["crates/raytwin-core", "crates/raytwin-store", "crates/raytwin-dist"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
